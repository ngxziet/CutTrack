<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bgGrad_banh-bao_4_3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="60%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <radialGradient id="glow_banh-bao_4_3" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad_banh-bao_4_3)"/>
  <rect width="800" height="600" fill="url(#glow_banh-bao_4_3)"/>

  <!-- Subtle Grid Pattern -->
  <g opacity="0.08" stroke="#94a3b8" stroke-width="1">
    <line x1="0" y1="0" x2="0" y2="600"/><line x1="40" y1="0" x2="40" y2="600"/><line x1="80" y1="0" x2="80" y2="600"/><line x1="120" y1="0" x2="120" y2="600"/><line x1="160" y1="0" x2="160" y2="600"/><line x1="200" y1="0" x2="200" y2="600"/><line x1="240" y1="0" x2="240" y2="600"/><line x1="280" y1="0" x2="280" y2="600"/><line x1="320" y1="0" x2="320" y2="600"/><line x1="360" y1="0" x2="360" y2="600"/><line x1="400" y1="0" x2="400" y2="600"/><line x1="440" y1="0" x2="440" y2="600"/><line x1="480" y1="0" x2="480" y2="600"/><line x1="520" y1="0" x2="520" y2="600"/><line x1="560" y1="0" x2="560" y2="600"/><line x1="600" y1="0" x2="600" y2="600"/><line x1="640" y1="0" x2="640" y2="600"/><line x1="680" y1="0" x2="680" y2="600"/><line x1="720" y1="0" x2="720" y2="600"/><line x1="760" y1="0" x2="760" y2="600"/>
    <line x1="0" y1="0" x2="800" y2="0"/><line x1="0" y1="40" x2="800" y2="40"/><line x1="0" y1="80" x2="800" y2="80"/><line x1="0" y1="120" x2="800" y2="120"/><line x1="0" y1="160" x2="800" y2="160"/><line x1="0" y1="200" x2="800" y2="200"/><line x1="0" y1="240" x2="800" y2="240"/><line x1="0" y1="280" x2="800" y2="280"/><line x1="0" y1="320" x2="800" y2="320"/><line x1="0" y1="360" x2="800" y2="360"/><line x1="0" y1="400" x2="800" y2="400"/><line x1="0" y1="440" x2="800" y2="440"/><line x1="0" y1="480" x2="800" y2="480"/><line x1="0" y1="520" x2="800" y2="520"/><line x1="0" y1="560" x2="800" y2="560"/>
  </g>

  <!-- Decorative Corner Accents -->
  <path d="M 24 50 L 24 24 L 50 24" stroke="#a855f7" stroke-width="3" fill="none" opacity="0.7"/>
  <path d="M 750 24 L 776 24 L 776 50" stroke="#a855f7" stroke-width="3" fill="none" opacity="0.7"/>
  <path d="M 24 550 L 24 576 L 50 576" stroke="#a855f7" stroke-width="3" fill="none" opacity="0.7"/>
  <path d="M 750 576 L 776 576 L 776 550" stroke="#a855f7" stroke-width="3" fill="none" opacity="0.7"/>

  <!-- Top Badges Bar -->
  <g transform="translate(36, 36)">
    <!-- CutTrack Logo Badge -->
    <rect width="180" height="34" rx="17" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <circle cx="17" cy="17" r="7" fill="#a855f7"/>
    <text x="32" y="22" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="13" fill="#f8fafc">CUTTRACK MEDIA</text>

    <!-- Category Badge -->
    <rect x="192" y="0" width="160" height="34" rx="17" fill="#7e22ce" opacity="0.3"/>
    <rect x="192" y="0" width="160" height="34" rx="17" fill="none" stroke="#a855f7" stroke-width="1.5"/>
    <text x="272" y="22" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="12" fill="#a855f7" text-anchor="middle">Bữa phụ / Kèm đá banh</text>
  </g>

  <!-- Ratio & Verified Badge (Top Right) -->
  <g transform="translate(570, 36)">
    <rect width="194" height="34" rx="17" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <rect x="6" y="6" width="55" height="22" rx="11" fill="#3b82f6" opacity="0.25"/>
    <text x="33.5" y="21" font-family="system-ui, sans-serif" font-weight="700" font-size="11" fill="#60a5fa" text-anchor="middle">4:3</text>
    <text x="122" y="22" font-family="system-ui, sans-serif" font-weight="600" font-size="12" fill="#94a3b8" text-anchor="middle">Official Placeholder</text>
  </g>

  <!-- Main Illustration Central Area -->
  <g id="illustration">
    
        <!-- Paper liner -->
        <ellipse cx="400" cy="311.04" rx="70.2" ry="21.6" fill="#cbd5e1" stroke="#94a3b8" stroke-width="2"/>
        <!-- Fluffy white bun body -->
        <ellipse cx="400" cy="280" rx="60" ry="46" fill="#f8fafc" stroke="#e2e8f0" stroke-width="3"/>
        <!-- Bun top pleats -->
        <path d="M 365 275 Q 400 245 400 245" stroke="#cbd5e1" stroke-width="3" fill="none"/>
        <path d="M 435 275 Q 400 245 400 245" stroke="#cbd5e1" stroke-width="3" fill="none"/>
        <path d="M 400 285 Q 400 245 400 245" stroke="#cbd5e1" stroke-width="3" fill="none"/>
        <!-- Red top dot -->
        <circle cx="400" cy="245" r="5" fill="#ef4444"/>
        <!-- Steam -->
        <path d="M 385 230 Q 375 205 385 185" stroke="#a855f7" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.75"/>
        <path d="M 415 230 Q 405 205 415 185" stroke="#a855f7" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.75"/>
      
  </g>

  
  <!-- Bottom Info Panel (4:3 layout) -->
  <g transform="translate(36, 420)">
    <rect width="728" height="144" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
    
    <!-- Title & Subtitle -->
    <text x="24" y="38" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="28" fill="#f8fafc">Bánh bao thịt trứng cút</text>
    <text x="24" y="62" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="14" fill="#94a3b8">Bánh bao hấp vỏ trắng xốp • Nhân thịt nạc, mộc nhĩ, 2 trứng cút</text>

    <!-- Nutrition Pills -->
    <g transform="translate(24, 82)">
      <!-- Calorie Pill -->
      <rect width="190" height="36" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <circle cx="16" cy="18" r="5" fill="#f59e0b"/>
      <text x="28" y="23" font-family="system-ui, sans-serif" font-weight="700" font-size="13" fill="#f8fafc">320 - 380 kcal / cái (130g)</text>

      <!-- Protein Pill -->
      <g transform="translate(202, 0)">
        <rect width="190" height="36" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
        <circle cx="16" cy="18" r="5" fill="#10b981"/>
        <text x="28" y="23" font-family="system-ui, sans-serif" font-weight="700" font-size="13" fill="#f8fafc">12g Protein • 45g Carbs</text>
      </g>

      <!-- Price Pill -->
      <g transform="translate(404, 0)">
        <rect width="160" height="36" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
        <text x="14" y="23" font-family="system-ui, sans-serif" font-weight="600" font-size="13" fill="#a855f7">~15.000 đ</text>
      </g>
    </g>

    <!-- Source & License Line -->
    <text x="704" y="128" font-family="system-ui, sans-serif" font-weight="500" font-size="11" fill="#64748b" text-anchor="end">CutTrack Project Asset • CC BY-SA 4.0</text>
  </g>
  
</svg>