    <rect x="6" y="6" width="55" height="22" rx="11" fill="#3b82f6" opacity="0.25"/>
    <text x="33.5" y="21" font-family="system-ui, sans-serif" font-weight="700" font-size="11" fill="#60a5fa" text-anchor="middle">4:3</text>
    <text x="122" y="22" font-family="system-ui, sans-serif" font-weight="600" font-size="12" fill="#94a3b8" text-anchor="middle">Official Placeholder</text>
  </g>

  <!-- Main Illustration Central Area -->
  <g id="illustration">
    
        <!-- Claypot -->
        <ellipse cx="400" cy="302.4" rx="108" ry="37.8" fill="#0f172a" opacity="0.4"/>
        <ellipse cx="400" cy="280.8" rx="97.2" ry="34.56" fill="#78350f" stroke="#92400e" stroke-width="4"/>
        <ellipse cx="400" cy="280.8" rx="81" ry="23.76" fill="#451a03"/>
        <!-- Frog meat pieces with savory pepper glaze -->
        <circle cx="375" cy="275" r="23.76" fill="#059669"/>
        <circle cx="420" cy="270" r="25.919999999999998" fill="#10b981"/>
        <circle cx="395" cy="285" r="21.6" fill="#34d399"/>
        <!-- Scallion & chili rings -->
        <circle cx="385" cy="272" r="4" fill="#ef4444"/>
        <circle cx="410" cy="280" r="4" fill="#22c55e"/>
        <circle cx="425" cy="265" r="3" fill="#facc15"/>
        <!-- Steam -->
        <path d="M 400 216 Q 415 172.8 400 140.4" stroke="#10b981" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.8"/>
      
  </g>

  
  <!-- Bottom Info Panel (4:3 layout) -->
  <g transform="translate(36, 420)">
    <rect width="728" height="144" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
    
    <!-- Title & Subtitle -->
    <text x="24" y="38" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="28" fill="#f8fafc">Cơm ếch kho</text>
    <text x="24" y="62" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="14" fill="#94a3b8">Đạm nạc giàu khoáng chất • Kho tiêu ớt cay nồng</text>

    <!-- Nutrition Pills -->
    <g transform="translate(24, 82)">
      <!-- Calorie Pill -->
      <rect width="190" height="36" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <circle cx="16" cy="18" r="5" fill="#f59e0b"/>
      <text x="28" y="23" font-family="system-ui, sans-serif" font-weight="700" font-size="13" fill="#f8fafc">480 - 540 kcal</text>

      <!-- Protein Pill -->
      <g transform="translate(202, 0)">
        <rect width="190" height="36" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
        <circle cx="16" cy="18" r="5" fill="#10b981"/>
        <text x="28" y="23" font-family="system-ui, sans-serif" font-weight="700" font-size="13" fill="#f8fafc">32g - 36g Protein</text>
      </g>

      <!-- Price Pill -->
      <g transform="translate(404, 0)">
        <rect width="160" height="36" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
        <text x="14" y="23" font-family="system-ui, sans-serif" font-weight="600" font-size="13" fill="#10b981">Giá theo quán</text>
      </g>
    </g>

    <!-- Source & License Line -->
    <text x="704" y="128" font-family="system-ui, sans-serif" font-weight="500" font-size="11" fill="#64748b" text-anchor="end">CutTrack Project Asset • CC BY-SA 4.0</text>
  </g>
  
