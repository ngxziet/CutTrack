  <!-- Decorative Corner Accents -->
  <path d="M 24 50 L 24 24 L 50 24" stroke="#10b981" stroke-width="3" fill="none" opacity="0.7"/>
  <path d="M 750 24 L 776 24 L 776 50" stroke="#10b981" stroke-width="3" fill="none" opacity="0.7"/>
  <path d="M 24 550 L 24 576 L 50 576" stroke="#10b981" stroke-width="3" fill="none" opacity="0.7"/>
  <path d="M 750 576 L 776 576 L 776 550" stroke="#10b981" stroke-width="3" fill="none" opacity="0.7"/>

  <!-- Top Badges Bar -->
  <g transform="translate(36, 36)">
