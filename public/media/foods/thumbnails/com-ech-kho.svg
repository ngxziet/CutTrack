    <rect width="180" height="34" rx="17" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <circle cx="17" cy="17" r="7" fill="#10b981"/>
    <text x="32" y="22" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="13" fill="#f8fafc">CUTTRACK MEDIA</text>

    <!-- Category Badge -->
    <rect x="192" y="0" width="160" height="34" rx="17" fill="#047857" opacity="0.3"/>
    <rect x="192" y="0" width="160" height="34" rx="17" fill="none" stroke="#10b981" stroke-width="1.5"/>
    <text x="272" y="22" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="12" fill="#10b981" text-anchor="middle">Đạm nạc tối ưu</text>
  </g>

  <!-- Ratio & Verified Badge (Top Right) -->
  <g transform="translate(570, 36)">
