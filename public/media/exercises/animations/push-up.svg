<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <style>
    /* Continuous smooth loop animation */
    @keyframes kfPushup {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(50px) rotate(-3deg); }
    }
    @keyframes kfArms {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(0.9, 0.6) translate(10px, 45px); }
    }
    @keyframes kfSquat {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(70px); }
    }
    @keyframes kfLunge {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(55px); }
    }
    @keyframes kfPlank {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.02); }
    }
    @keyframes kfRevCrunch {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-25deg) translateY(-20px); }
    }
    @keyframes kfOppLimb1 {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-35deg) translate(-20px, 15px); }
    }
    @keyframes kfOppLimb2 {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(20deg) translate(30px, 10px); }
    }
    @keyframes kfBridge {
      0%, 100% { transform: translateY(20px); }
      50% { transform: translateY(-30px); }
    }
    @keyframes kfRowArm {
      0%, 100% { transform: translateY(30px); }
      50% { transform: translateY(-20px); }
    }
    @keyframes kfClimber {
      0%, 100% { transform: translateX(0px); }
      50% { transform: translateX(45px); }
    }
    @keyframes kfBall {
      0%, 100% { transform: translate(0px, 0px) rotate(0deg); }
      50% { transform: translate(30px, -15px) rotate(180deg); }
    }
    @keyframes kfPulse {
      0%, 100% { opacity: 0.4; transform: scale(1); }
      50% { opacity: 0.9; transform: scale(1.15); }
    }
    @keyframes kfPhaseText {
      0%, 45% { opacity: 1; fill: #38bdf8; }
      50%, 95% { opacity: 1; fill: #f59e0b; }
    }

    .anim-pushup { animation: kfPushup 3s ease-in-out infinite; transform-origin: 240px 460px; }
    .anim-arms { animation: kfArms 3s ease-in-out infinite; transform-origin: 475px 466px; }
    .anim-squat { animation: kfSquat 3.2s ease-in-out infinite; transform-origin: 400px 505px; }
    .anim-lunge { animation: kfLunge 3s ease-in-out infinite; transform-origin: 400px 495px; }
    .anim-plank { animation: kfPlank 2.5s ease-in-out infinite; transform-origin: 400px 430px; }
    .anim-rev-crunch { animation: kfRevCrunch 3s ease-in-out infinite; transform-origin: 420px 435px; }
    .anim-limb-opp-1 { animation: kfOppLimb1 3.5s ease-in-out infinite; transform-origin: 360px 430px; }
    .anim-limb-opp-2 { animation: kfOppLimb2 3.5s ease-in-out infinite; transform-origin: 440px 430px; }
    .anim-bridge { animation: kfBridge 3s ease-in-out infinite; transform-origin: 320px 465px; }
    .anim-row-arm { animation: kfRowArm 2.8s ease-in-out infinite; transform-origin: 425px 355px; }
    .anim-climber { animation: kfClimber 1.4s ease-in-out infinite alternate; }
    .anim-drive-knee { animation: kfClimber 1.4s ease-in-out infinite alternate; }
    .anim-ball { animation: kfBall 1.8s ease-in-out infinite alternate; }
    .anim-pulse { animation: kfPulse 2s ease-in-out infinite; transform-origin: center; }

    /* Accessibility: Respect user reduced motion preferences */
    @media (prefers-reduced-motion: reduce) {
      *, .anim-pushup, .anim-arms, .anim-squat, .anim-lunge, .anim-plank, 
      .anim-rev-crunch, .anim-limb-opp-1, .anim-limb-opp-2, .anim-bridge, 
      .anim-row-arm, .anim-climber, .anim-drive-knee, .anim-ball, .anim-pulse {
        animation: none !important;
      }
    }
  </style>

  <defs>
    <linearGradient id="bgGradAnim_push-up" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <radialGradient id="glowAnim_push-up" cx="35%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panelGradAnim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bgGradAnim_push-up)"/>
  <rect width="1280" height="720" fill="url(#glowAnim_push-up)"/>

  <!-- Tech Grid Background -->
  <g opacity="0.06" stroke="#94a3b8" stroke-width="1">
    <line x1="0" y1="0" x2="0" y2="720"/><line x1="40" y1="0" x2="40" y2="720"/><line x1="80" y1="0" x2="80" y2="720"/><line x1="120" y1="0" x2="120" y2="720"/><line x1="160" y1="0" x2="160" y2="720"/><line x1="200" y1="0" x2="200" y2="720"/><line x1="240" y1="0" x2="240" y2="720"/><line x1="280" y1="0" x2="280" y2="720"/><line x1="320" y1="0" x2="320" y2="720"/><line x1="360" y1="0" x2="360" y2="720"/><line x1="400" y1="0" x2="400" y2="720"/><line x1="440" y1="0" x2="440" y2="720"/><line x1="480" y1="0" x2="480" y2="720"/><line x1="520" y1="0" x2="520" y2="720"/><line x1="560" y1="0" x2="560" y2="720"/><line x1="600" y1="0" x2="600" y2="720"/><line x1="640" y1="0" x2="640" y2="720"/><line x1="680" y1="0" x2="680" y2="720"/><line x1="720" y1="0" x2="720" y2="720"/><line x1="760" y1="0" x2="760" y2="720"/><line x1="800" y1="0" x2="800" y2="720"/><line x1="840" y1="0" x2="840" y2="720"/><line x1="880" y1="0" x2="880" y2="720"/><line x1="920" y1="0" x2="920" y2="720"/><line x1="960" y1="0" x2="960" y2="720"/><line x1="1000" y1="0" x2="1000" y2="720"/><line x1="1040" y1="0" x2="1040" y2="720"/><line x1="1080" y1="0" x2="1080" y2="720"/><line x1="1120" y1="0" x2="1120" y2="720"/><line x1="1160" y1="0" x2="1160" y2="720"/><line x1="1200" y1="0" x2="1200" y2="720"/><line x1="1240" y1="0" x2="1240" y2="720"/>
    <line x1="0" y1="0" x2="1280" y2="0"/><line x1="0" y1="40" x2="1280" y2="40"/><line x1="0" y1="80" x2="1280" y2="80"/><line x1="0" y1="120" x2="1280" y2="120"/><line x1="0" y1="160" x2="1280" y2="160"/><line x1="0" y1="200" x2="1280" y2="200"/><line x1="0" y1="240" x2="1280" y2="240"/><line x1="0" y1="280" x2="1280" y2="280"/><line x1="0" y1="320" x2="1280" y2="320"/><line x1="0" y1="360" x2="1280" y2="360"/><line x1="0" y1="400" x2="1280" y2="400"/><line x1="0" y1="440" x2="1280" y2="440"/><line x1="0" y1="480" x2="1280" y2="480"/><line x1="0" y1="520" x2="1280" y2="520"/><line x1="0" y1="560" x2="1280" y2="560"/><line x1="0" y1="600" x2="1280" y2="600"/><line x1="0" y1="640" x2="1280" y2="640"/><line x1="0" y1="680" x2="1280" y2="680"/>
  </g>

  <!-- Top Badges -->
  <g transform="translate(36, 36)">
    <rect width="220" height="34" rx="17" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <circle cx="17" cy="17" r="7" fill="#ef4444"/>
    <text x="32" y="22" font-family="system-ui, sans-serif" font-weight="700" font-size="13" fill="#f8fafc">ANIMATION ĐỘNG LOOP</text>

    <!-- Reduced motion note -->
    <rect x="232" y="0" width="190" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="327" y="22" font-family="system-ui, sans-serif" font-weight="600" font-size="11" fill="#94a3b8" text-anchor="middle">Reduced-Motion Compatible</text>
  </g>

  <!-- Live Pulse Playing Indicator (Top Right) -->
  <g transform="translate(1040, 36)">
    <rect width="204" height="34" rx="17" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
    <circle cx="20" cy="17" r="5" fill="#10b981" class="anim-pulse"/>
    <text x="110" y="22" font-family="system-ui, sans-serif" font-weight="700" font-size="12" fill="#34d399" text-anchor="middle">LOOPING DEMO • AUTO</text>
  </g>

  <!-- Animated Biomechanical Figure -->
  <g id="animatedFigure">
    
        <!-- Bench / Floor line -->
        <line x1="160" y1="470" x2="600" y2="470" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
        <line x1="200" y1="470" x2="560" y2="470" stroke="#64748b" stroke-width="2" stroke-dasharray="8 8"/>
        
        <g class="anim-pushup">
          <!-- Feet contact -->
          <circle cx="240" cy="462" r="8" fill="#64748b"/>
          
          <!-- Torso & Legs line (Rigid Plank) -->
          <line x1="245" y1="455" x2="480" y2="370" stroke="#f8fafc" stroke-width="12" stroke-linecap="round"/>
          <line x1="245" y1="455" x2="480" y2="370" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
          
          <!-- Muscle Target Highlight (Chest & Triceps) -->
          <ellipse cx="450" cy="380" rx="24" ry="14" fill="#38bdf8" opacity="0.6"/>
          
          <!-- Arms -->
          <g class="anim-arms">
            <polyline points="480,375 470,420 475,466" fill="none" stroke="#f8fafc" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
            <polyline points="480,375 470,420 475,466" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
          </g>
          
          <!-- Hands on ground -->
          <ellipse cx="475" cy="466" rx="14" ry="6" fill="#0284c7"/>
          
          <!-- Head -->
          <circle cx="520" cy="354" r="18" fill="#f8fafc"/>
          <circle cx="520" cy="354" r="14" fill="#334155"/>
          
          <!-- Neutral Spine Guideline -->
          <line x1="230" y1="462" x2="540" y2="344" stroke="#10b981" stroke-width="2" stroke-dasharray="6 6" opacity="0.7"/>
        </g>
      
  </g>

  <!-- Dynamic Phase / Tempo HUD overlay in central zone -->
  <g transform="translate(240, 610)">
    <rect width="320" height="52" rx="26" fill="#0f172a" stroke="#334155" stroke-width="1.5" opacity="0.95"/>
    <!-- Breathing cue -->
    <circle cx="28" cy="26" r="10" fill="#38bdf8" opacity="0.8" class="anim-pulse"/>
    <text x="50" y="31" font-family="system-ui, sans-serif" font-weight="700" font-size="13" fill="#f8fafc">Hít vào khi hạ • Thở ra khi đẩy</text>
    <rect x="250" y="14" width="54" height="24" rx="12" fill="#1e293b"/>
    <text x="277" y="30" font-family="system-ui, sans-serif" font-weight="700" font-size="11" fill="#facc15" text-anchor="middle">TEMPO</text>
  </g>

  <!-- Right Side Specification & Instruction Card -->
  <g transform="translate(790, 105)">
    <rect width="454" height="575" rx="20" fill="url(#panelGradAnim)" stroke="#334155" stroke-width="1.5"/>
    
    <g transform="translate(30, 36)">
      <!-- Exercise Title & Vi Name -->
      <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="32" fill="#f8fafc">Chống đẩy tiêu chuẩn</text>
      <text x="0" y="26" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="15" fill="#38bdf8">Hướng dẫn chuyển động chuẩn</text>

      <!-- Divider -->
      <line x1="0" y1="45" x2="394" y2="45" stroke="#334155" stroke-width="1"/>

      <!-- Dynamic Movement Guide -->
      <g transform="translate(0, 62)">
        <rect width="394" height="70" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
        <text x="18" y="24" font-family="system-ui, sans-serif" font-weight="600" font-size="11" fill="#94a3b8" letter-spacing="1">GIAI ĐOẠN CHUYỂN ĐỘNG</text>
        <text x="18" y="48" font-family="system-ui, sans-serif" font-weight="800" font-size="15" fill="#38bdf8">1. Eccentric (Hạ có kiểm soát, hít sâu)</text>
        <text x="18" y="64" font-family="system-ui, sans-serif" font-weight="800" font-size="15" fill="#f59e0b">2. Concentric (Đẩy bùng nổ, thở dứt khoát)</text>
      </g>

      <!-- Sets & Reps -->
      <g transform="translate(0, 142)">
        <rect width="394" height="58" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
        <text x="18" y="22" font-family="system-ui, sans-serif" font-weight="600" font-size="11" fill="#94a3b8" letter-spacing="1">ĐỀ XUẤT TẬP LUYỆN</text>
        <text x="18" y="44" font-family="system-ui, sans-serif" font-weight="700" font-size="14" fill="#facc15">3 hiệp × 12-18 cái (dưới ngưỡng kiệt sức)</text>
      </g>

      <!-- Checklist -->
      <g transform="translate(0, 210)">
        <rect width="394" height="135" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
        <text x="18" y="22" font-family="system-ui, sans-serif" font-weight="700" font-size="11" fill="#34d399" letter-spacing="1">CẢM NHẬN CƠ &amp; LỖI CẦN TRÁNH:</text>
        
          <g transform="translate(18, 42)">
            <circle cx="4" cy="-4" r="3" fill="#38bdf8"/>
            <text x="15" y="0" font-family="system-ui, sans-serif" font-weight="400" font-size="13" fill="#cbd5e1">Thẳng từ gót đến đầu</text>
          </g>
        
          <g transform="translate(18, 68)">
            <circle cx="4" cy="-4" r="3" fill="#38bdf8"/>
            <text x="15" y="0" font-family="system-ui, sans-serif" font-weight="400" font-size="13" fill="#cbd5e1">Cùi chỏ 45° so với thân</text>
          </g>
        
          <g transform="translate(18, 94)">
            <circle cx="4" cy="-4" r="3" fill="#38bdf8"/>
            <text x="15" y="0" font-family="system-ui, sans-serif" font-weight="400" font-size="13" fill="#cbd5e1">Khóa chặt bả vai khi đẩy</text>
          </g>
        
      </g>

      <!-- Attribution Footer -->
      <g transform="translate(0, 365)">
        <rect width="394" height="60" rx="8" fill="#1e293b" opacity="0.6"/>
        <text x="16" y="25" font-family="system-ui, sans-serif" font-weight="600" font-size="12" fill="#38bdf8">💡 Vector SVG Animation độc quyền</text>
        <text x="16" y="44" font-family="system-ui, sans-serif" font-weight="400" font-size="11" fill="#94a3b8">Dung lượng siêu nhẹ (~5KB), loop vô tận, không hao băng thông</text>
      </g>
    </g>
  </g>
</svg>