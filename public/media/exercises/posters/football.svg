<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="bgGrad_football" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <radialGradient id="glow_football" cx="35%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#84cc16" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#84cc16" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bgGrad_football)"/>
  <rect width="1280" height="720" fill="url(#glow_football)"/>

  <!-- Subtle Sport Grid lines -->
  <g opacity="0.06" stroke="#94a3b8" stroke-width="1">
    <line x1="0" y1="0" x2="0" y2="720"/><line x1="40" y1="0" x2="40" y2="720"/><line x1="80" y1="0" x2="80" y2="720"/><line x1="120" y1="0" x2="120" y2="720"/><line x1="160" y1="0" x2="160" y2="720"/><line x1="200" y1="0" x2="200" y2="720"/><line x1="240" y1="0" x2="240" y2="720"/><line x1="280" y1="0" x2="280" y2="720"/><line x1="320" y1="0" x2="320" y2="720"/><line x1="360" y1="0" x2="360" y2="720"/><line x1="400" y1="0" x2="400" y2="720"/><line x1="440" y1="0" x2="440" y2="720"/><line x1="480" y1="0" x2="480" y2="720"/><line x1="520" y1="0" x2="520" y2="720"/><line x1="560" y1="0" x2="560" y2="720"/><line x1="600" y1="0" x2="600" y2="720"/><line x1="640" y1="0" x2="640" y2="720"/><line x1="680" y1="0" x2="680" y2="720"/><line x1="720" y1="0" x2="720" y2="720"/><line x1="760" y1="0" x2="760" y2="720"/><line x1="800" y1="0" x2="800" y2="720"/><line x1="840" y1="0" x2="840" y2="720"/><line x1="880" y1="0" x2="880" y2="720"/><line x1="920" y1="0" x2="920" y2="720"/><line x1="960" y1="0" x2="960" y2="720"/><line x1="1000" y1="0" x2="1000" y2="720"/><line x1="1040" y1="0" x2="1040" y2="720"/><line x1="1080" y1="0" x2="1080" y2="720"/><line x1="1120" y1="0" x2="1120" y2="720"/><line x1="1160" y1="0" x2="1160" y2="720"/><line x1="1200" y1="0" x2="1200" y2="720"/><line x1="1240" y1="0" x2="1240" y2="720"/>
    <line x1="0" y1="0" x2="1280" y2="0"/><line x1="0" y1="40" x2="1280" y2="40"/><line x1="0" y1="80" x2="1280" y2="80"/><line x1="0" y1="120" x2="1280" y2="120"/><line x1="0" y1="160" x2="1280" y2="160"/><line x1="0" y1="200" x2="1280" y2="200"/><line x1="0" y1="240" x2="1280" y2="240"/><line x1="0" y1="280" x2="1280" y2="280"/><line x1="0" y1="320" x2="1280" y2="320"/><line x1="0" y1="360" x2="1280" y2="360"/><line x1="0" y1="400" x2="1280" y2="400"/><line x1="0" y1="440" x2="1280" y2="440"/><line x1="0" y1="480" x2="1280" y2="480"/><line x1="0" y1="520" x2="1280" y2="520"/><line x1="0" y1="560" x2="1280" y2="560"/><line x1="0" y1="600" x2="1280" y2="600"/><line x1="0" y1="640" x2="1280" y2="640"/><line x1="0" y1="680" x2="1280" y2="680"/>
  </g>

  <!-- Tech Boundary Corners -->
  <path d="M 28 55 L 28 28 L 55 28" stroke="#84cc16" stroke-width="3" fill="none" opacity="0.8"/>
  <path d="M 1225 28 L 1252 28 L 1252 55" stroke="#84cc16" stroke-width="3" fill="none" opacity="0.8"/>
  <path d="M 28 665 L 28 692 L 55 692" stroke="#84cc16" stroke-width="3" fill="none" opacity="0.8"/>
  <path d="M 1225 692 L 1252 692 L 1252 665" stroke="#84cc16" stroke-width="3" fill="none" opacity="0.8"/>

  <!-- Top Navigation Badges -->
  <g transform="translate(36, 36)">
    <rect width="210" height="34" rx="17" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <circle cx="17" cy="17" r="7" fill="#84cc16"/>
    <text x="32" y="22" font-family="system-ui, sans-serif" font-weight="700" font-size="13" fill="#f8fafc">CUTTRACK WORKOUT</text>

    <!-- Difficulty Badge -->
    <rect x="222" y="0" width="160" height="34" rx="17" fill="#4d7c0f" opacity="0.3"/>
    <rect x="222" y="0" width="160" height="34" rx="17" fill="none" stroke="#84cc16" stroke-width="1.5"/>
    <text x="302" y="22" font-family="system-ui, sans-serif" font-weight="600" font-size="12" fill="#84cc16" text-anchor="middle">Năng động thể thao (Dynamic)</text>
  </g>

  <!-- Media Type & Ratio (Top Right) -->
  <g transform="translate(1030, 36)">
    <rect width="214" height="34" rx="17" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <rect x="6" y="6" width="60" height="22" rx="11" fill="#10b981" opacity="0.25"/>
    <text x="36" y="21" font-family="system-ui, sans-serif" font-weight="700" font-size="11" fill="#34d399" text-anchor="middle">POSTER</text>
    <text x="136" y="22" font-family="system-ui, sans-serif" font-weight="600" font-size="12" fill="#94a3b8" text-anchor="middle">16:9 • Static Pose</text>
  </g>

  <!-- Central Biomechanical Figure -->
  <g id="figure">
    
        <!-- Turf / Field Grass Line -->
        <line x1="180" y1="480" x2="600" y2="480" stroke="#4d7c0f" stroke-width="6" stroke-linecap="round"/>
        <line x1="200" y1="480" x2="580" y2="480" stroke="#84cc16" stroke-width="2" stroke-dasharray="12 12"/>
        
        <g class="">
          <!-- Athlete dynamic running stance -->
          <!-- Head & Sports headband -->
          <circle cx="410" cy="305" r="18" fill="#f8fafc"/>
          <line x1="392" y1="305" x2="428" y2="305" stroke="#ef4444" stroke-width="4"/>
          
          <!-- Torso forward lean 30 deg -->
          <line x1="410" y1="323" x2="385" y2="380" stroke="#f8fafc" stroke-width="13" stroke-linecap="round"/>
          
          <!-- Driving front leg -->
          <polyline points="385,380 445,400 435,465" fill="none" stroke="#f8fafc" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
          <ellipse cx="435" cy="472" rx="14" ry="6" fill="#f97316"/>
          
          <!-- Trailing kick/stride leg -->
          <polyline points="385,380 335,405 290,435" fill="none" stroke="#84cc16" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
          
          <!-- Arms pumping in sprint -->
          <polyline points="405,340 450,355 435,375" fill="none" stroke="#94a3b8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
          <polyline points="405,340 365,350 350,330" fill="none" stroke="#94a3b8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
          
          <!-- Soccer Ball -->
          <g transform="translate(485, 448)" class="">
            <circle cx="0" cy="0" r="22" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
            <!-- Pentagon / Ball pattern -->
            <polygon points="0,-10 9,-3 6,8 -6,8 -9,-3" fill="#0f172a"/>
            <line x1="0" y1="-10" x2="0" y2="-20" stroke="#0f172a" stroke-width="2"/>
            <line x1="9" y1="-3" x2="19" y2="-5" stroke="#0f172a" stroke-width="2"/>
            <line x1="6" y1="8" x2="14" y2="17" stroke="#0f172a" stroke-width="2"/>
            <line x1="-6" y1="8" x2="-14" y2="17" stroke="#0f172a" stroke-width="2"/>
            <line x1="-9" y1="-3" x2="-19" y2="-5" stroke="#0f172a" stroke-width="2"/>
          </g>
          
          <!-- Motion Dash Vectors -->
          <line x1="260" y1="360" x2="320" y2="360" stroke="#84cc16" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
          <line x1="240" y1="385" x2="300" y2="385" stroke="#84cc16" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
        </g>
      
  </g>

  <!-- Right Side Specification & Instruction Card -->
  <g transform="translate(790, 105)">
    <rect width="454" height="575" rx="20" fill="url(#panelGrad)" stroke="#334155" stroke-width="1.5"/>
    
    <g transform="translate(30, 36)">
      <!-- Exercise Title & Vi Name -->
      <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="32" fill="#f8fafc">Thể lực &amp; Điều hòa bóng đá</text>
      <text x="0" y="26" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="15" fill="#84cc16">Football Conditioning</text>

      <!-- Divider -->
      <line x1="0" y1="45" x2="394" y2="45" stroke="#334155" stroke-width="1"/>

      <!-- Target Muscles Card -->
      <g transform="translate(0, 62)">
        <rect width="394" height="65" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
        <text x="18" y="22" font-family="system-ui, sans-serif" font-weight="600" font-size="11" fill="#94a3b8" letter-spacing="1">NHÓM CƠ MỤC TIÊU</text>
        <text x="18" y="45" font-family="system-ui, sans-serif" font-weight="700" font-size="14" fill="#38bdf8">Sức bền tim mạch HIIT • Tốc độ đổi hướng •</text>
        <text x="18" y="58" font-family="system-ui, sans-serif" font-weight="700" font-size="13" fill="#38bdf8"> Bùng nổ chi dưới</text>
      </g>

      <!-- Volume & Reps Card -->
      <g transform="translate(0, 138)">
        <rect width="394" height="58" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
        <text x="18" y="22" font-family="system-ui, sans-serif" font-weight="600" font-size="11" fill="#94a3b8" letter-spacing="1">KHỐI LƯỢNG &amp; SỐ LẦN</text>
        <text x="18" y="44" font-family="system-ui, sans-serif" font-weight="700" font-size="14" fill="#facc15">1 trận 45 phút / tuần (hoặc bài bổ trợ)</text>
      </g>

      <!-- Tempo Card -->
      <g transform="translate(0, 206)">
        <rect width="394" height="58" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
        <text x="18" y="22" font-family="system-ui, sans-serif" font-weight="600" font-size="11" fill="#94a3b8" letter-spacing="1">NHỊP ĐỘ (TEMPO)</text>
        <text x="18" y="44" font-family="system-ui, sans-serif" font-weight="700" font-size="13" fill="#a78bfa">Nước rút ngắt quãng + phục hồi</text>
      </g>

      <!-- Technical Keypoints Checklist -->
      <g transform="translate(0, 274)">
        <rect width="394" height="120" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
        <text x="18" y="22" font-family="system-ui, sans-serif" font-weight="700" font-size="11" fill="#34d399" letter-spacing="1">✓ 3 ĐIỂM KỸ THUẬT QUAN TRỌNG:</text>
        
          <g transform="translate(18, 42)">
            <circle cx="4" cy="-4" r="3" fill="#84cc16"/>
            <text x="15" y="0" font-family="system-ui, sans-serif" font-weight="400" font-size="13" fill="#cbd5e1">Khởi động kỹ cổ chân gối trước trận</text>
          </g>
        
          <g transform="translate(18, 66)">
            <circle cx="4" cy="-4" r="3" fill="#84cc16"/>
            <text x="15" y="0" font-family="system-ui, sans-serif" font-weight="400" font-size="13" fill="#cbd5e1">Bù điện giải và nước từng ngụm nhỏ</text>
          </g>
        
          <g transform="translate(18, 90)">
            <circle cx="4" cy="-4" r="3" fill="#84cc16"/>
            <text x="15" y="0" font-family="system-ui, sans-serif" font-weight="400" font-size="13" fill="#cbd5e1">Giãn cơ bắp chân và đùi sau trận</text>
          </g>
        
      </g>

      <!-- Attribution Footer -->
      <g transform="translate(0, 416)">
        <text x="0" y="0" font-family="system-ui, sans-serif" font-weight="500" font-size="11" fill="#64748b">CutTrack Exercise Spec • Bản quyền CC BY-SA 4.0</text>
        <text x="0" y="16" font-family="system-ui, sans-serif" font-weight="500" font-size="11" fill="#475569">isPlaceholder: true • Chuẩn y khoa thể thao</text>
      </g>
    </g>
  </g>
</svg>